<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2480" viewBox="0 0 1280 2480">
  <defs>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #16283d; }
      .title { font-size: 48px; font-weight: 800; }
      .sub { font-size: 26px; fill: #536170; }
      .option { font-size: 34px; font-weight: 800; }
      .desc { font-size: 23px; fill: #536170; }
      .phone-title { font-size: 22px; font-weight: 700; fill: white; }
      .label { font-size: 18px; font-weight: 700; fill: #536170; }
      .body { font-size: 22px; }
      .small { font-size: 18px; fill: #536170; }
      .nav { font-size: 20px; font-weight: 700; fill: white; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16283d" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1280" height="2480" fill="#eef1f4"/>
  <text x="80" y="90" class="title">기출 세부문항 학습 화면</text>
  <text x="80" y="140" class="sub">같은 문항을 어떤 순서로 읽을지 비교한 모바일 목업입니다.</text>

  <g transform="translate(70 205)">
    <rect width="1140" height="650" rx="30" fill="white" filter="url(#shadow)"/>
    <text x="55" y="65" class="option">A. 단계별 펼침형</text>
    <text x="55" y="105" class="desc">문제를 먼저 풀고 필요한 부분만 펼칩니다. 초보자는 여러 번 눌러야 합니다.</text>
    <g transform="translate(390 135)">
      <rect width="630" height="455" rx="26" fill="#fffdf7" stroke="#8d9aa5" stroke-width="2"/>
      <path d="M26 0 H604 Q630 0 630 26 V65 H0 V26 Q0 0 26 0" fill="#16324f"/>
      <text x="28" y="42" class="phone-title">2011 세법학 1부 · 제1문 (1)</text>
      <text x="28" y="100" class="label">기출문제 원문</text>
      <text x="28" y="138" class="body" font-weight="700">법인격 없는 단체의 납세의무를 논하시오…</text>
      <line x1="0" y1="166" x2="630" y2="166" stroke="#ddd5c6"/>
      <text x="30" y="207" class="body">＋ 초보자를 위한 문제 해석</text>
      <line x1="0" y1="230" x2="630" y2="230" stroke="#ddd5c6"/>
      <text x="30" y="271" class="body">＋ 모범답안</text>
      <line x1="0" y1="294" x2="630" y2="294" stroke="#ddd5c6"/>
      <text x="30" y="335" class="body">＋ 답안 해설</text>
      <line x1="0" y1="358" x2="630" y2="358" stroke="#ddd5c6"/>
      <text x="30" y="399" class="body">＋ 관련 쟁점</text>
    </g>
  </g>

  <g transform="translate(70 905)">
    <rect width="1140" height="800" rx="30" fill="white" filter="url(#shadow)" stroke="#0b6f69" stroke-width="5"/>
    <rect x="55" y="35" width="120" height="42" rx="21" fill="#0b6f69"/>
    <text x="78" y="64" font-size="21" font-weight="800" fill="white">추천</text>
    <text x="200" y="68" class="option">B. 순서대로 읽는 학습형</text>
    <text x="55" y="115" class="desc">원문부터 관련 쟁점까지 숨김 없이 한 번에 내려 읽습니다.</text>
    <g transform="translate(285 150)">
      <rect width="770" height="600" rx="26" fill="#fffdf7" stroke="#8d9aa5" stroke-width="2"/>
      <path d="M26 0 H744 Q770 0 770 26 V62 H0 V26 Q0 0 26 0" fill="#16324f"/>
      <text x="28" y="40" class="phone-title">2011 세법학 1부 · 제1문 (1)</text>
      <rect x="0" y="62" width="770" height="95" fill="#fffdf7"/>
      <rect x="0" y="62" width="7" height="95" fill="#155d9c"/>
      <text x="28" y="93" class="label">1 · 기출문제 원문</text>
      <text x="28" y="132" class="body" font-weight="700">법인격 없는 단체의 납세의무를 논하시오…</text>
      <rect x="0" y="157" width="770" height="90" fill="#fff4d9"/>
      <text x="28" y="188" class="label" fill="#765100">2 · 초보자용 문제 읽기</text>
      <text x="28" y="224" class="body">누구에게 세금을 매길지 먼저 찾는 문제입니다.</text>
      <rect x="0" y="247" width="770" height="87" fill="#fffdf7"/>
      <text x="28" y="278" class="label">3 · 한눈에 보는 정답</text>
      <text x="28" y="313" class="body">① 단체 유형　② 이익분배　③ 소득 귀속</text>
      <rect x="0" y="334" width="770" height="120" fill="#fffdf7" stroke="#ddd5c6"/>
      <text x="28" y="367" class="label">4 · 완성형 답안과 문단별 해설</text>
      <rect x="28" y="387" width="714" height="43" rx="6" fill="#edf1f5"/>
      <text x="44" y="416" class="small">답안 문단을 읽고 바로 아래에서 왜 그렇게 쓰는지 설명</text>
      <rect x="0" y="454" width="770" height="75" fill="#e3f2ef"/>
      <text x="28" y="500" class="body" font-weight="700">5 · 다음에 볼 관련 쟁점 3개 →</text>
      <rect x="0" y="529" width="770" height="71" fill="#16324f"/>
      <text x="130" y="574" class="nav">← 이전 문항　　목록　　다음 문항 →</text>
    </g>
  </g>

  <g transform="translate(70 1755)">
    <rect width="1140" height="650" rx="30" fill="white" filter="url(#shadow)"/>
    <text x="55" y="65" class="option">C. 탭 전환형</text>
    <text x="55" y="105" class="desc">빠르게 이동할 수 있지만 문제와 해설의 연결이 끊기기 쉽습니다.</text>
    <g transform="translate(345 135)">
      <rect width="680" height="455" rx="26" fill="#fffdf7" stroke="#8d9aa5" stroke-width="2"/>
      <path d="M26 0 H654 Q680 0 680 26 V62 H0 V26 Q0 0 26 0" fill="#16324f"/>
      <text x="28" y="40" class="phone-title">2011 세법학 1부 · 제1문 (1)</text>
      <rect x="0" y="62" width="170" height="55" fill="#155d9c"/>
      <rect x="170" y="62" width="170" height="55" fill="#f8f5ed"/>
      <rect x="340" y="62" width="170" height="55" fill="#f8f5ed"/>
      <rect x="510" y="62" width="170" height="55" fill="#f8f5ed"/>
      <text x="60" y="97" font-size="19" font-weight="700" fill="white">문제</text>
      <text x="230" y="97" class="small">답안</text>
      <text x="400" y="97" class="small">해설</text>
      <text x="570" y="97" class="small">쟁점</text>
      <text x="28" y="155" class="label">기출문제 원문</text>
      <text x="28" y="196" class="body" font-weight="700">법인격 없는 단체의 납세의무를 논하시오…</text>
      <rect x="28" y="225" width="624" height="100" rx="8" fill="#edf1f5"/>
      <text x="48" y="265" class="small">현재 선택한 탭의 내용만 표시</text>
      <text x="48" y="299" class="small">다른 내용을 보려면 위 탭으로 이동</text>
      <rect x="0" y="384" width="680" height="71" fill="#16324f"/>
      <text x="85" y="429" class="nav">← 이전 문항　　목록　　다음 문항 →</text>
    </g>
  </g>
</svg>
