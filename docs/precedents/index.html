<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>최신판례 학습 · 세법 사건배당부</title>
  <style>
    :root {
      color-scheme: light;
      --stone-0: #f8f5ed;
      --stone-1: #eee9dd;
      --stone-2: #ddd5c6;
      --ink: #16283d;
      --ink-soft: #536170;
      --paper: #fffdf7;
      --blue: #155d9c;
      --blue-soft: #dceaf5;
      --teal: #0b6f69;
      --teal-soft: #d9ece8;
      --amber: #8b4d00;
      --amber-soft: #f6e4c4;
      --coral: #a43d31;
      --coral-soft: #f4ddd7;
      --rule: #8d9aa5;
      --control-rule: #687684;
      --focus: #005fcc;
      --measure: 72ch;
      --page: 1240px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { background: var(--stone-1); scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--stone-1);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    ::selection { color: var(--paper); background: var(--blue); }

    a {
      color: var(--blue);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.22em;
    }

    a:hover { color: #0b416f; text-decoration-thickness: 2px; }

    select, button { color: inherit; font: inherit; }

    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .skip-link {
      position: fixed;
      z-index: 10;
      top: 0.5rem;
      left: 0.5rem;
      padding: 0.65rem 0.9rem;
      color: var(--paper);
      background: var(--ink);
      transform: translateY(-180%);
    }

    .skip-link:focus { transform: translateY(0); }

    .masthead {
      border-top: 6px solid var(--ink);
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
    }

    .masthead__inner {
      width: min(calc(100% - 2.5rem), var(--page));
      min-height: 4.6rem;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .masthead__title { margin: 0; font-size: 1.28rem; letter-spacing: -0.02em; }

    .readonly {
      padding: 0.28rem 0.62rem;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--stone-0);
      font-size: 0.75rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .primary-nav { position: sticky; z-index: 8; top: 0; border-bottom: 1px solid var(--rule); background: var(--paper); }
    .primary-nav__inner { width: min(calc(100% - 2.5rem), var(--page)); margin-inline: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .primary-nav a { min-height: 48px; display: flex; align-items: center; justify-content: center; padding: 0.45rem 0.7rem; color: var(--ink-soft); font-size: 0.84rem; font-weight: 800; text-align: center; text-decoration: none; }
    .primary-nav a[aria-current="page"] { color: var(--blue); background: var(--blue-soft); }

    main {
      width: min(calc(100% - 2.5rem), var(--page));
      margin-inline: auto;
      padding-block: 1.5rem 5rem;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(13rem, 0.5fr);
      border-top: 5px solid var(--blue);
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
    }

    .intro__copy, .intro__window { padding: 1.5rem; }
    .intro__window { border-left: 1px solid var(--rule); background: var(--stone-0); }
    .intro h2 { max-width: 18ch; margin: 0 0 0.75rem; font-size: clamp(1.55rem, 4vw, 1.8rem); line-height: 1.18; letter-spacing: -0.03em; }
    .intro p { max-width: var(--measure); margin: 0; color: var(--ink-soft); }
    .window-label { margin: 0 0 0.35rem; color: var(--ink-soft); font-size: 0.76rem; font-weight: 800; }
    .window-range { margin: 0; font-variant-numeric: tabular-nums; font-size: 1.08rem; font-weight: 850; }
    .window-note { margin-top: 0.55rem; font-size: 0.78rem; }

    .filters {
      margin-top: 1.5rem;
      border-top: 4px solid var(--teal);
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
      padding: 1.15rem 1.5rem 1.35rem;
    }

    .filters h2 { margin: 0 0 0.9rem; font-size: 1.04rem; letter-spacing: -0.01em; }
    .filter-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.9rem; }
    .filter-field { display: grid; gap: 0.34rem; }
    .filter-field label { font-size: 0.78rem; font-weight: 800; }
    .filter-field select {
      width: 100%;
      min-height: 44px;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--control-rule);
      border-radius: 2px;
      background: var(--paper);
      cursor: pointer;
    }

    .result-bar {
      margin-top: 1rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      color: var(--ink-soft);
      font-size: 0.84rem;
    }

    .result-bar strong { color: var(--ink); font-size: 1rem; }

    .register {
      margin-top: 1.5rem;
      border-top: 1px solid var(--rule);
      background: var(--paper);
    }

    .precedent {
      display: grid;
      grid-template-columns: minmax(11rem, 0.34fr) minmax(0, 1fr);
      border-bottom: 1px solid var(--rule);
    }

    .precedent__identity { padding: 1.35rem; background: var(--stone-0); }
    .precedent__body { min-width: 0; padding: 1.35rem 1.5rem 1.55rem; }
    .case-number { margin: 0; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 0.84rem; font-weight: 850; }
    .case-meta { margin: 0.45rem 0 0; color: var(--ink-soft); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    .source-link { display: inline-block; margin-top: 0.85rem; font-size: 0.8rem; font-weight: 750; }
    .precedent__body h3 { max-width: 32ch; margin: 0; font-size: 1.28rem; line-height: 1.35; letter-spacing: -0.02em; }
    .issue { max-width: var(--measure); margin: 0.75rem 0 0; }

    .tags { display: flex; flex-wrap: wrap; gap: 0.38rem; margin: 0.9rem 0 0; padding: 0; list-style: none; }
    .tag { padding: 0.22rem 0.52rem; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); font-size: 0.72rem; }
    .tag--impact { border-color: var(--amber); color: #6a3a00; background: var(--amber-soft); }
    .tag--source { border-color: var(--coral); color: #742b23; background: var(--coral-soft); }

    .reveal-stack { margin-top: 1.15rem; border-top: 1px solid var(--rule); }
    details { border-bottom: 1px solid var(--rule); }
    summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.72rem 0.15rem;
      cursor: pointer;
      font-weight: 800;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--blue); font-size: 1.2rem; line-height: 1; }
    details[open] summary::after { content: "−"; }
    .reveal-content { max-width: var(--measure); padding: 0 0.15rem 1.1rem; color: var(--ink-soft); }
    .reveal-content p { margin: 0.55rem 0 0; }
    .reveal-content h4 { margin: 1rem 0 0.35rem; color: var(--ink); font-size: 0.88rem; }
    .evidence-list { margin: 0.35rem 0 0; padding-left: 1.25rem; }
    .answer-note { padding: 0.65rem 0.75rem; border: 1px solid var(--amber); background: var(--amber-soft); color: #6a3a00; font-size: 0.8rem; font-weight: 750; }
    .material-link { display: inline-block; margin-top: 1rem; font-size: 0.83rem; font-weight: 800; }

    .empty {
      margin: 0;
      padding: 2rem 1.5rem;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-soft);
      background: var(--stone-0);
    }

    @media (max-width: 720px) {
      body { padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }
      .masthead__inner, main { width: min(calc(100% - 1.25rem), var(--page)); }
      .masthead__inner { align-items: flex-start; padding-block: 0.9rem; }
      .intro { grid-template-columns: minmax(0, 1fr); }
      .intro__window { border-top: 1px solid var(--rule); border-left: 0; }
      .filter-grid { grid-template-columns: minmax(0, 1fr); }
      .precedent { grid-template-columns: minmax(0, 1fr); }
      .precedent__identity { border-bottom: 1px solid var(--rule); }
      .precedent__body { padding-inline: 1.1rem; }
      .result-bar { align-items: flex-start; flex-direction: column; gap: 0.25rem; }
      .primary-nav { position: fixed; top: auto; right: 0; bottom: 0; left: 0; border-top: 1px solid var(--rule); border-bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
      .primary-nav__inner { width: 100%; }
      .primary-nav a { min-height: 64px; padding: 0.35rem 0.2rem; font-size: 0.72rem; line-height: 1.2; }
    }

    @media (max-width: 380px) {
      .masthead__inner { display: grid; gap: 0.5rem; }
      .intro__copy, .intro__window, .filters, .precedent__identity { padding-inline: 1rem; }
      .intro h2 { font-size: 1.55rem; }
      summary { align-items: flex-start; }
    }

    @media print {
      :root { --ink: #000; --ink-soft: #222; --paper: #fff; --stone-0: #fff; --stone-1: #fff; --rule: #555; }
      .skip-link, .primary-nav, .filters { display: none !important; }
      body, main { padding-bottom: 0; background: #fff; }
      main { width: 100%; padding: 0; }
      .masthead__inner, .intro, .register { width: 100%; }
      .precedent { break-inside: avoid; }
      details > *:not(summary) { display: block !important; }
      summary::after { display: none; }
      a { color: #000; text-decoration: underline; }
    }
  </style>
</head>
<body>
  <!--
  THESIS: 최신 판례를 뉴스 카드가 아니라 검증된 사건대장으로 읽으며, 단순 요약목록을 거부한다.
  OWN-WORLD: 석재 배경·종이 표면·잉크 네이비·공식 파랑과 규선으로 기존 사건배당부를 잇는다.
  STORY: 사용자는 최근 12개월 범위를 확인하고 법률·쟁점·영향을 좁힌 뒤 법리→조사→시험 순으로 학습한다.
  FIRST VIEWPORT: 얇은 masthead 아래 범위와 역할을 나눈 사건대장 표제, 이어지는 세 필터가 첫 행동이다.
  FORM: ruled precedent register, incumbent extension, seed key latest-precedent-register-v1.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="masthead">
    <div class="masthead__inner">
      <h1 class="masthead__title">세법 사건배당부 · 최신판례</h1>
      <span class="readonly">읽기 전용 · 진도 미반영</span>
    </div>
  </header>

  <nav class="primary-nav" aria-label="주요 학습 메뉴">
    <div class="primary-nav__inner">
      <a href="../dashboard/index.html">오늘 학습</a>
      <a href="../curriculum/index.html">전체 교육과정</a>
      <a href="../exams/index.html">기출문제 학습</a>
      <a href="../precedents/index.html" aria-current="page">최신판례 학습</a>
      <a href="../laws/index.html">법령 조문</a>
    </div>
  </nav>

  <main id="main-content" tabindex="-1">
    <section class="intro" aria-labelledby="page-title">
      <div class="intro__copy">
        <h2 id="page-title">최근 판례를 법리에서 조사와 답안까지</h2>
        <p>최근 12개월의 공식 공개 판례만 모았습니다. 자유열람은 핵심 교육과정의 완료·숙달·복습 기록을 바꾸지 않습니다.</p>
      </div>
      <div class="intro__window">
        <p class="window-label">검증된 선고일 범위</p>
        <p class="window-range" id="window-range">불러오는 중</p>
        <p class="window-note">build date 기준 달력상 12개월, 양 끝 날짜 포함</p>
      </div>
    </section>

    <section class="filters" aria-labelledby="filter-title">
      <h2 id="filter-title">사건대장 좁혀보기</h2>
      <div class="filter-grid">
        <div class="filter-field">
          <label for="law-filter">법률</label>
          <select id="law-filter"><option value="">모든 법률</option></select>
        </div>
        <div class="filter-field">
          <label for="topic-filter">학습 쟁점</label>
          <select id="topic-filter"><option value="">모든 쟁점</option></select>
        </div>
        <div class="filter-field">
          <label for="impact-filter">현행 법리 영향</label>
          <select id="impact-filter">
            <option value="">모든 영향</option>
            <option value="none">변경 없음</option>
            <option value="supplement">보충 법리</option>
            <option value="source_update_required">핵심 수업 갱신 검토</option>
          </select>
        </div>
      </div>
      <div class="result-bar">
        <strong id="result-count" aria-live="polite">0건</strong>
        <span id="active-filter-summary">전체 공식 판례</span>
      </div>
    </section>

    <section class="register" id="precedent-register" aria-label="최신판례 사건대장"></section>
  </main>

  <template id="precedent-card-template">
    <article class="precedent">
      <div class="precedent__identity">
        <p class="case-number"></p>
        <p class="case-meta"></p>
        <a class="source-link" rel="noopener noreferrer">공식 판결 자료</a>
      </div>
      <div class="precedent__body">
        <h3></h3>
        <p class="issue"></p>
        <ul class="tags"></ul>
        <div class="reveal-stack">
          <details class="holding-detail">
            <summary>판결 결론과 학습 의미</summary>
            <div class="reveal-content holding-content"></div>
          </details>
          <details class="audit-detail">
            <summary>사건시점 법령과 조사 적용</summary>
            <div class="reveal-content audit-content">
              <h4>사건시점 법령</h4>
              <p class="law-note"></p>
              <h4>조사 가설</h4>
              <p class="audit-hypothesis"></p>
              <h4>반대가설</h4>
              <p class="counter-hypothesis"></p>
              <h4>확인증빙</h4>
              <ul class="evidence-list"></ul>
            </div>
          </details>
          <details class="exam-detail">
            <summary>시험 질문과 독립 해설</summary>
            <div class="reveal-content exam-content">
              <h4>시험 질문</h4>
              <p class="exam-question"></p>
              <h4>해설</h4>
              <p class="learning-explanation"></p>
              <p class="answer-note">학습용 해설이며 공식 답안이 아닙니다.</p>
            </div>
          </details>
        </div>
        <a class="material-link">관련 핵심 수업</a>
      </div>
    </article>
  </template>

  <script id="precedents-data" type="application/json">{"count":10,"generated_at":"2026-09-01","precedents":[{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"국세기본법 제81조의12 제1항, 제81조의15 제2항 제1호·제4항·제9항, 같은 법 시행령 제63조의13 제1항·제2항과 제63조의15 제4항을 적용한다. 기초세목은 2016년 제2기 부가가치세와 조세특례제한법 제106조 제1항 제4호이고, 2022년 5월 조사, 2023년 10월 16일 재통지, 2023년 12월 20일 과세전적부심사 결정, 2024년 1월 8일 재처분의 각 절차일에 시행된 법령을 분리 대조해야 한다.","audit_application":{"audit_hypothesis":"당초 처분 취소 뒤 적법한 재통지와 과세전적부심사 기회 부여를 거쳐 재처분하여 절차상 하자가 보완되었다.","counter_hypothesis":"조사결과 통지기한 또는 과세전적부심사 결정 전 처분 유보의무를 위반하여 재처분에도 독립된 절차상 하자가 남아 있다.","evidence_to_check":["당초 조사결과 통지서와 처분서","이의신청 취소결정서","재통지서와 과세전적부심사 접수·결정 기록","재처분일과 제척기간을 함께 표시한 절차 타임라인"]},"case_number":"2026두30542","court":"대법원","current_law_impact":"source_update_required","decision_date":"2026-08-13","exam_question":"당초 처분 취소 뒤 재처분이 이루어진 경우 하자 보완의 허용 범위와 조사결과 통지기한 위반 및 과세전적부심사 중 처분의 효력을 논하시오.","holding_summary":"대법원은 과세전적부심사 기회를 주지 않은 당초 처분을 취소한 뒤 절차상 하자를 보완하여 재처분하는 것은 원칙적으로 허용되고, 조사결과 통지기한을 위반한 처분은 원칙적으로 위법하며, 과세전적부심사 청구가 있으면 결정 시점까지 처분을 유보해야 한다고 판시하였다. 다만 이 사건에서는 지연된 재통지 뒤에도 납세자가 실제로 과세전적부심사를 청구·행사하고 그 결정 후 재처분이 이루어진 특별한 사정이 있어 재처분을 적법하다고 보아 상고를 기각하였다.","issue_summary":"과세전적부심사 기회를 부여하지 않은 당초 처분이 취소된 뒤 하자를 보완한 재처분의 허용 범위, 세무조사 결과 통지기한 위반의 효력, 과세전적부심사 결정 전 처분 유보의무가 문제 된 사건이다.","learning_explanation":"재처분 가능성만으로 결론내리지 말고, 당초 취소 사유가 보완되었는지와 재통지기한·전적부심사 결정 전 처분 유보의무가 각각 지켜졌는지를 날짜별로 판단해야 한다.","learning_material_href":"../lesson-reader/material-ntba-illegal-audit-remedy-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1787793813825_102333.pdf","related_topics":[{"primary_law":"국세기본법","title":"위법한 세무조사와 절차상 하자의 구제","topic_id":"NTBA-ILLEGAL-AUDIT-REMEDY-001"},{"primary_law":"국세기본법","title":"세무조사 절차·사전통지·연기","topic_id":"NTBA-AUDIT-PROCEDURE-001"}],"significance":"조사종결 뒤 통지·전적부심사·재처분의 시간을 하나의 절차 사슬로 대사해야 하며, 하자 보완 가능성과 별개로 각 통지기한과 처분 유보기간을 독립 검토해야 한다."},{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"성과급 2012~2014, 고문료 2013~2015, 미수이자 2015의 사업연도를 분리한다. 구 법인세법(2018년 12월 24일 법률 제16008호 개정 전) 제19조 제1항·제2항과 제52조, 법인세법 제40조 제1항, 구 법인세법 시행령(2016년 2월 12일 대통령령 제26981호 개정 전) 제88조 제1항, 구 국세기본법(2017년 12월 19일 법률 제15220호 개정 전) 제81조의12, 구 국세기본법 시행규칙(2018년 3월 19일 기획재정부령 제665호 개정 전) 제37조·별지 제56호서식을 쟁점별로 적용한다.","audit_application":{"audit_hypothesis":"성과급·고문료는 객관적 업무나 적법한 성과에 대응하지 않고, 약정 미수이자는 권리가 확정되었으며, 자회사 용역대가는 정상가격을 벗어나 과세조정 대상이다. 고문료의 실제 기타소득 처분을 납세법인이 인식하고 다툴 수 있었으므로 두 통지의 소득종류 차이로 방어권 침해가 없었다.","counter_hypothesis":"각 지급에는 실제 업무와 합리적 산식이 있고 이자채권의 권리확정에 제한이 있으며, 자회사 용역대가의 비정상성을 뒷받침할 비교가능 자료가 부족하다. 세무조사결과통지의 상여 표기로 실제 기타소득 처분을 예측하지 못해 과세전적부심사 기회가 실질적으로 침해되었다.","evidence_to_check":["성과급 약정·산식과 재무제표 수정·감사 자료","이자 약정·미수이자 원장과 권리행사 기록","고문계약·업무일지·결과물과 지급원장","자회사 설계용역 계약·결과물·원가배부·비교가격 자료","세무조사결과통지서 원본과 소득금액변동통지서 원본의 소득종류·금액·귀속연도·송달일","과세전적부심사 청구서·의견서·결정서와 실제 불이익 주장 자료"]},"case_number":"2022두42020","court":"대법원","current_law_impact":"source_update_required","decision_date":"2026-08-12","exam_question":"복수 사업연도의 성과급·미수이자·고문료·특수관계 용역비를 손금, 익금 귀속, 부당행위계산 부인의 요건과 증명책임에 따라 각각 논하고, 두 통지의 소득종류가 다른 경우 절차상 효력을 실제 인식 가능성과 과세전적부심사의 불이익을 기준으로 판단하시오.","holding_summary":"대법원은 분식회계에 기초해 지급한 성과급은 손금에 산입할 수 없고, 고문료는 구체적으로 수행한 업무 활동 내용이 확인되지 않아 손금 요건을 갖추었다고 보기 어려우며, 약정일에 발생한 미수이자는 2015 사업연도 익금에 산입되고, 특수관계 자회사 설계용역비에 대한 부당행위계산 부인은 과세관청의 증명이 부족하다고 보아 상고를 기각하였다. 또한 세무조사결과통지에는 고문료 소득종류가 상여로, 후행 소득금액변동통지에는 기타소득으로 달리 기재되었어도 납세법인이 실제 기타소득 처분을 충분히 인식하고 과세전적부심사로 다투는 데 별다른 어려움이나 불이익이 없었다면 그 불일치만으로 소득금액변동통지에 절차상 하자가 있다고 볼 수 없다고 판단하였다.","issue_summary":"분식회계에 기초한 성과급의 손금성, 약정 미수이자의 익금 귀속, 실제 업무가 확인되지 않은 고문료의 손금성, 특수관계 자회사 설계용역비에 대한 부당행위계산 부인의 증명 정도와 세무조사결과통지·소득금액변동통지 사이 소득종류 불일치의 절차상 하자가 함께 문제 된 사건이다.","learning_explanation":"거래들을 하나의 조세회피 결론으로 묶지 말고 성과급과 고문료는 실제 업무·지급근거, 미수이자는 권리확정 시점, 특수관계 용역비는 정상가격과 과세관청의 증명을 별도 검토한다. 두 통지의 소득종류 불일치가 자동으로 무효나 하자를 뜻하지 않으며, 실제 인식과 방어기회가 결정적이고 반대 사실이면 별도로 판단해야 한다.","learning_material_href":"../lesson-reader/material-cta-deductibility-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1787278654868_111734.pdf","related_topics":[{"primary_law":"법인세법","title":"손금의 요건과 업무관련성","topic_id":"CTA-DEDUCTIBILITY-001"},{"primary_law":"법인세법","title":"익금의 범위와 귀속시기","topic_id":"CTA-GROSS-INCOME-001"},{"primary_law":"법인세법","title":"부당행위계산 부인의 요건과 경제적 합리성","topic_id":"CTA-RELATED-PARTY-001"},{"primary_law":"법인세법","title":"급여·상여·퇴직급여","topic_id":"CTA-COMPENSATION-001"},{"primary_law":"법인세법","title":"원천징수·소득처분 통지와 후속의무","topic_id":"CTA-WITHHOLDING-DISPOSITION-NOTICE-001"}],"significance":"하나의 조사에서 여러 회계·세무조정 쟁점이 발견되어도 비용의 업무관련성, 수익 귀속시기, 특수관계 거래의 정상가격과 증명책임을 섞지 않고 별도 workpaper로 구성하고, 세무조사결과통지와 소득금액변동통지 두 통지의 소득종류·금액·송달일과 실제 방어기회를 별도 대사해야 함을 보여준다."},{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"구 법인세법(2018년 12월 24일 법률 제16008호 개정 전) 제19조 제1항·제2항과 구 대부업 등의 등록 및 금융이용자 보호에 관한 법률(2025년 1월 21일 법률 제20714호 개정 전) 제1조, 제2조 제1호·제2호, 제8조 제2항, 제11조의2, 제19조 제2항 제6호부터 제9호까지를 적용한다. 현행 제19조 제4항 제6호부터 제9호까지와 지급 사업연도별 상한 규정을 별도로 대조해야 한다.","audit_application":{"audit_hypothesis":"지급액 중 법정 상한 초과분은 사회질서에 반하는 지출이므로 손금불산입 대상이다.","counter_hypothesis":"지급액이 상한 내에 있거나 해당 지급관계에 상한 규정이 적용되지 않아 통상적인 사업상 비용이다.","evidence_to_check":["대부중개계약서와 수수료 산식","사건 당시 법정 상한 자료","지급원장과 계좌이체 증빙","상대방 등록·소속 및 실제 중개업무 기록"]},"case_number":"2026두30158","court":"대법원","current_law_impact":"supplement","decision_date":"2026-05-14","exam_question":"강행규정상 상한을 초과한 중개수수료의 손금성을 업무관련성과 사회질서 위반의 관점에서 논하시오.","holding_summary":"대법원은 법정 상한을 초과한 대부중개수수료는 사회질서에 위반하여 지출된 비용으로서 손금에 산입할 수 없다는 취지로 상고를 기각하였다.","issue_summary":"대부중개수수료 법정 상한을 초과하여 지급한 금액이 법인의 손금에 산입될 수 있는지가 문제 된 사건이다.","learning_explanation":"실제 지급과 업무관련성만 서술하지 말고, 상한 규정의 적용대상·초과액을 먼저 확정한 뒤 그 위반 지출의 규범적 성격이 손금 요건을 배제하는지 포섭해야 한다.","learning_material_href":"../lesson-reader/material-cta-deductibility-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1779239194331_100634.pdf","related_topics":[{"primary_law":"법인세법","title":"손금의 요건과 업무관련성","topic_id":"CTA-DEDUCTIBILITY-001"}],"significance":"비용이 실제 지급되고 수익과 관련되어 보여도 강행규정 위반과 사회질서 침해의 성격을 별도로 검토해야 함을 보여준다."},{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"출자전환일에 적용되는 구 법인세법(2018년 12월 24일 법률 제16008호 개정 전) 제17조 제1항 제1호 단서·제52조 제2항, 법인세법 시행령 제11조 제6호와 구 상속세 및 증여세법 시행령(2015년 2월 3일 대통령령 제26069호 개정 전) 제54조 제4항·제2항, 제55조 제3항, 제59조를 적용한다. 발행가액·시가·채무소멸액은 출자전환일 기준으로 대사한다.","audit_application":{"audit_hypothesis":"출자전환 주식의 발행가액 중 시가 초과액은 법문상 익금불산입 제외 대상이며 법인의 회생기업 여부는 제한요건이 아니다.","counter_hypothesis":"발행가액·시가 평가 또는 채무소멸액 산정이 달라 시가 초과액 자체가 발생하지 않거나 적용 법령이 다르다.","evidence_to_check":["채권원장과 출자전환 계약·결의","주식 액면가·발행가액·시가 평가자료","주식발행 회계처리와 채무소멸 분개","법인세 신고서와 익금 세무조정"]},"case_number":"2025두34763","court":"대법원","current_law_impact":"supplement","decision_date":"2026-04-30","exam_question":"출자전환 주식의 시가 초과 발행금액에 대한 익금불산입 제외 규정의 적용범위와 과세표준 조정을 논하시오.","holding_summary":"대법원은 해당 익금불산입 제외 규정의 적용대상을 회생기업 또는 부실기업으로 한정할 수 없다는 취지로 상고를 기각하였다.","issue_summary":"출자전환으로 발행한 주식의 발행가액 중 시가 초과액에 관한 익금불산입 제외 규정이 회생기업이나 부실기업에만 적용되는지가 문제 된 사건이다.","learning_explanation":"회생절차라는 배경을 먼저 결론으로 삼지 말고, 적용연도 법문·발행가액·시가·소멸채무를 확정한 다음 법문에 없는 대상 제한을 추가할 수 있는지 검토한다.","learning_material_href":"../lesson-reader/material-cta-gross-income-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1778492213462_183653.pdf","related_topics":[{"primary_law":"법인세법","title":"익금의 범위와 귀속시기","topic_id":"CTA-GROSS-INCOME-001"}],"significance":"출자전환의 정책적 배경만으로 법문에 없는 적용대상 제한을 더하지 말고 발행가액·시가·채무소멸액을 직접 대사해야 한다."},{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"구 국세기본법(2018년 12월 31일 법률 제16097호 개정 전) 제81조의4 제1항·제2항, 제81조의2 제2항 제1호, 제55조 제1항 제1호와 제81조의15 구 제1항 제1호·제2항 제2호(현행 제2항 제1호·제3항 제2호), 구 조세범 처벌절차법(2018년 12월 31일 법률 제16108호 개정 전) 제2조 제1호부터 제3호까지·제7조 제1항·제13조 제1호·제15조 제1항·제4항, 조세범 처벌법 제3조 제1항, 민법 제741조, 헌법 제12조 제1항을 적용한다. 소득금액변동통지는 구 법인세법(2016년 12월 20일 법률 제14386호 개정 전) 제67조와 구 시행령(2017년 2월 3일 대통령령 제27828호 개정 전) 제106조 제1항 제1호를 적용하고, 2010~2016 세목·2014년 조사·2018년 조사와 통지를 분리한다.","audit_application":{"audit_hypothesis":"후행 조사는 선행 조사와 목적·기간·세목·과세기간·질문 및 제출요구 범위가 달라 금지되는 중복 세무조사가 아니다.","counter_hypothesis":"후행 조사가 선행 조사와 실질적으로 같은 세목·기간·거래를 다시 확인하여 중복 세무조사 금지를 위반했고 그 하자가 후행 처분에 전이되었다.","evidence_to_check":["선행·후행 조사의 목적·기간·범위 비교표","질문서와 자료제출요구 목록","범칙조사 전환·통고처분과 벌금상당액 납부 기록","소득금액변동통지와 과세전적부심사 기회 부여 타임라인"]},"case_number":"2025다210837","court":"대법원","current_law_impact":"source_update_required","decision_date":"2026-04-30","exam_question":"중복 세무조사 금지 위반이 과세처분·통고처분·소득금액변동통지에 미치는 효력과 납부액 반환 가능성을 논하시오.","holding_summary":"대법원은 중복 세무조사에 기한 과세는 자료 의존 여부와 무관하게 원칙적으로 위법하고, 그 하자가 있는 조세범칙조사 통고처분의 효력도 부정되며 납부한 벌금상당액의 반환을 구할 수 있고, 과세전적부심사 기회 없이 한 소득금액변동통지는 예외가 없으면 원칙적으로 무효라는 취지로 상고를 기각하였다.","issue_summary":"중복 세무조사에 기초한 과세·조세범칙조사 통고처분·소득금액변동통지의 효력과 납부한 벌금상당액의 부당이득 반환이 문제 된 사건이다.","learning_explanation":"후행 처분이 어떤 자료를 직접 사용했는지만 보지 말고 선행·후행 조사의 실질적 동일성을 먼저 판단한 뒤, 중복조사의 하자가 각 처분의 효력과 반환청구에 미치는 범위를 개별적으로 서술한다.","learning_material_href":"../lesson-reader/material-ntba-audit-rights-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1778491333352_182213.pdf","related_topics":[{"primary_law":"국세기본법","title":"세무조사권·중복조사 금지","topic_id":"NTBA-AUDIT-RIGHTS-001"},{"primary_law":"국세기본법","title":"위법한 세무조사와 절차상 하자의 구제","topic_id":"NTBA-ILLEGAL-AUDIT-REMEDY-001"},{"primary_law":"법인세법","title":"원천징수·소득처분 통지와 후속의무","topic_id":"CTA-WITHHOLDING-DISPOSITION-NOTICE-001"}],"significance":"선행·후행 조사의 실질을 먼저 비교하고, 그 절차상 하자가 과세처분·통고처분·소득금액변동통지로 어떻게 전이되는지를 처분별로 나누어 검토하게 한다."},{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"2018년 제1기·제2기 거래에 부가가치세법 제2조, 제3조 제1항, 제4조 제1호, 제9조, 제11조, 제14조 제1항 제2호, 제26조 제1항 제1호와 구 부가가치세법 시행령(2019년 2월 12일 대통령령 제29535호 개정 전) 제3조 제1항, 제4조, 제18조 제1항 제2호, 제25조 제2호, 제34조 제3항을 적용한다. 2018 사업연도 법인세와 구 한국표준산업분류(2024년 1월 1일 통계청고시 제2024-2호 시행 전)를 함께 대조해야 한다.","audit_application":{"audit_hypothesis":"꽃장식은 과세대상 용역이고 결혼예식용역과 계약·대가가 일괄된 부수 공급이다.","counter_hypothesis":"완성된 꽃장식의 소유권이 별도 계약·대가에 따라 이전되고 고객이 이를 독립된 목적으로 거래하여 주된 예식용역과 분리되는 재화 공급이다.","evidence_to_check":["예식계약과 꽃장식 계약의 통합성","대금의 일괄 또는 별도 수수 내역","설치 방식·소유권 이전·독립사업성 자료","세금계산서 품목과 부가가치세 신고 대사"]},"case_number":"2025두35626","court":"대법원","current_law_impact":"supplement","decision_date":"2026-04-16","exam_question":"복합적인 예식 거래에서 꽃장식의 재화·용역 분류와 주된·부수 공급 여부를 판단하는 기준을 논하시오.","holding_summary":"대법원은 꽃장식 공급이 재화가 아니라 부가가치세 과세대상인 용역의 공급이고, 설령 꽃의 소유권이 이전되더라도 계약과 대가가 일괄되고 독립적으로 이루어지지 않아 주된 결혼예식용역에 부수되는 공급이라고 보아 상고를 기각하였다.","issue_summary":"예식 관련 꽃장식 공급이 재화 공급인지 용역 공급인지, 다른 예식용역의 주된 공급에 부수되는지 독립된 공급인지가 문제 된 사건이다.","learning_explanation":"계약서 제목 하나로 분류하지 말고 설치행위와 고객이 받은 급부를 먼저 보아 과세대상 용역인지 판단한다. 이어 별도 계약·대가·독립 목적이 있는지를 확인하여 주된 결혼예식용역에 부수되는 공급인지 포섭한다.","learning_material_href":"../lesson-reader/material-vat-supply-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1776737056102_110416.pdf","related_topics":[{"primary_law":"부가가치세법","title":"재화·용역 공급과 실제 공급자","topic_id":"VAT-SUPPLY-001"},{"primary_law":"부가가치세법","title":"주된 거래·부수거래·복합공급","topic_id":"VAT-ANCILLARY-COMPOSITE-SUPPLY-001"},{"primary_law":"부가가치세법","title":"과세·면세·영세율·비과세의 구분","topic_id":"VAT-TAXABILITY-CLASSIFICATION-001"}],"significance":"품목 명칭보다 계약과 실제 이행을 기준으로 공급 유형과 복합공급 관계를 판단하고 세금계산서·신고 결과를 대사하게 한다."},{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"2018·2019년 부담금과 2019·2020 사업연도 법인세에 구 장애인고용촉진 및 직업재활법(2021년 7월 20일 법률 제18308호 개정 전) 제1조·제28조 제1항·제33조 제1항·제37조 제1항·제3항, 부담금관리 기본법 제2조·제3조·별표 제67호, 구 국세기본법(2020년 12월 22일 법률 제17650호 개정 전) 제2조 제8호, 구 법인세법(2024년 12월 31일 법률 제20613호 개정 전) 제21조 제5호를 적용한다.","audit_application":{"audit_hypothesis":"부담금의 실질이 위법행위 제재에 해당하여 손금불산입 공과금이다.","counter_hypothesis":"부담금은 정책상 고용의무 이행을 유도하고 비용을 조정하는 제도로서 제재성 공과금이 아니다.","evidence_to_check":["장애인 고용률과 의무고용 인원 산정표","부담금 결정서와 납부자료","공과금 계정 원장과 비용 인식 분개","법인세 신고서의 손금 조정 내역"]},"case_number":"2024두30809","court":"대법원","current_law_impact":"supplement","decision_date":"2026-03-12","exam_question":"장애인고용부담금의 손금산입 여부를 제재성 공과금의 판단 기준과 사실관계에 따라 논하시오.","holding_summary":"대법원은 장애인고용부담금이 제재성 공과금에 해당하지 않아 해당 손금불산입 조항을 적용할 수 없다는 취지로 상고를 기각하였다.","issue_summary":"장애인고용부담금이 법인세법상 제재적 성격의 공과금으로서 손금불산입 대상인지가 문제 된 사건이다.","learning_explanation":"납부의무가 법률에 있다는 사실보다 부담금의 목적·발생요건·산정방식이 위반행위에 대한 제재인지부터 판별하고, 해당 손금불산입 규정의 문언에 포섭한다.","learning_material_href":"../lesson-reader/material-cta-tax-fine-deduction-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1773809100296_134500.pdf","related_topics":[{"primary_law":"법인세법","title":"세금·공과금·벌금·과태료의 손금성","topic_id":"CTA-TAX-FINE-DEDUCTION-001"}],"significance":"공과금이라는 명칭만으로 손금불산입하지 않고 부담금의 목적·산정구조·제재성을 구체적으로 판단하게 한다."},{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"2017년 귀속 배당에 구 소득세법(2017년 12월 19일 법률 제15225호 개정 전) 제17조 제1항·제3항·제6항과 제56조 제1항·제2항, 구 소득세법 시행령(2021년 2월 17일 대통령령 제31442호 개정 전) 제27조의3 제1항·제2항, 조세특례제한법 제132조를 적용한다. 법인의 2009~2015년 감면 사실은 구 조세특례제한법(2010년 1월 1일 법률 제9921호 개정 전) 제63조의2 제1항·제2항에 따른 것이고 2016년부터 감면규정을 적용하지 않았다. 판결의 기준은 실제 배당재원 추적이 아니라 이익배당 기준 사업연도에 법인이 감면규정을 적용받았는지 여부이다.","audit_application":{"audit_hypothesis":"배당의 기준 사업연도에 법인이 감면을 받아 해당 배당의 전부 또는 일부가 배당세액공제 제외 대상이다.","counter_hypothesis":"이익배당 기준 사업연도에는 법인이 감면규정을 적용받지 않았거나 제외비율 산정이 과다하다.","evidence_to_check":["이익배당 기준 사업연도와 배당결의서","해당 기준 사업연도의 법인세 감면규정 적용 명세","배당결의서와 원천징수 자료","배당세액공제 제외비율 산식"]},"case_number":"2025두34726","court":"대법원","current_law_impact":"supplement","decision_date":"2026-02-12","exam_question":"감면받은 법인의 배당에 대한 배당세액공제 제외 여부와 기준 사업연도의 의미를 논하시오.","holding_summary":"대법원은 배당세액공제 제외 여부는 이익배당의 기준이 되는 사업연도에 감면을 받은 법인의 배당인지에 따라 판단한다는 취지로 상고를 기각하였다.","issue_summary":"법인 단계에서 감면된 소득과 관련된 배당에 대한 배당세액공제 제외를 어느 사업연도를 기준으로 판단하는지가 문제 된 사건이다.","learning_explanation":"개인의 배당 수령일이나 과거 감면이익의 실제 재원을 추적하지 않는다. 이익배당 기준 사업연도에 법인이 법정 감면규정을 적용받았는지를 확인하고 그 사업연도의 제외비율 산식으로 공제 가능액을 계산한다.","learning_material_href":"../lesson-reader/material-ita-financial-income-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1771813421635_112341.pdf","related_topics":[{"primary_law":"소득세법","title":"이자·배당소득과 금융소득 종합과세","topic_id":"ITA-FINANCIAL-INCOME-001"}],"significance":"배당 지급연도나 과거 감면이익의 실제 재원을 추적하지 않고, 이익배당 기준 사업연도에 법인이 감면규정을 적용받았는지 여부와 제외비율을 대사하게 한다."},{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"국세기본법 제81조의15, 구 국세기본법 시행령(2019년 2월 12일 대통령령 제29534호 개정 전) 제12조의3 제1항 제1호·제2항 제3호, 구 조세특례제한법(2017년 12월 19일 법률 제15227호 개정 전) 제63조의2 제2항·제7항 제3호를 적용한다. 수도권 재이전일은 2017년 7월 5일, 기산일은 2018년 4월 1일, 5년 제척기간 만료일은 2023년 3월 31일이고, 2022년 6월 21일 과세예고일부터 만료일까지 3개월을 초과하므로 과세전적부심사 예외가 아니다.","audit_application":{"audit_hypothesis":"과세예고 뒤 법정 대기기간과 과세전적부심사 기회를 보장한 다음 처분하여 절차가 적법하다.","counter_hypothesis":"과세예고와 처분이 같은 날 이루어졌고 적용 가능한 예외사유도 없어 중대·명백한 절차상 하자로 처분이 무효이다.","evidence_to_check":["과세예고통지서와 송달증명","과세처분서와 처분일","과세전적부심사 청구 가능기간 계산표","수도권 재이전일·신고기한 다음 날·5년 제척기간 만료일 계산표","즉시 처분 예외사유 자료와 불복 절차 타임라인"]},"case_number":"2025두34254","court":"대법원","current_law_impact":"source_update_required","decision_date":"2025-12-04","exam_question":"과세예고와 같은 날 이루어진 과세처분의 무효 여부와 감면세액 추징의 부과제척기간 기산일, 취소 뒤 재처분 가능성을 구분하여 논하시오.","holding_summary":"대법원은 과세예고와 같은 날 처분하여 과세전적부심사 기회를 침해한 하자가 중대하고 명백하여 처분이 무효라고 보았다. 또한 구 국세기본법 시행령 제12조의3 제2항 제3호의 ‘징수할 수 있는 사유가 발생한 날’은 2017년 7월 5일 수도권 재이전일이 아니라 과세관청이 징수절차에 나아갈 수 있는 2017 사업연도 신고기한 다음 날인 2018년 4월 1일이라고 판시하여 상고를 기각하였다.","issue_summary":"과세예고통지와 같은 날 과세처분을 하여 납세자의 과세전적부심사 기회를 침해한 하자가 처분의 무효사유인지와, 감면세액 추징의 부과제척기간 기산일이 문제 된 사건이다.","learning_explanation":"과세전적부심사 기회 침해의 중대·명백성을 먼저 판단한다. 이어 구 시행령 제12조의3 제2항 제3호가 적용되는 추징인지 확인하고, 의무불이행일 자체가 아니라 징수절차에 나아갈 수 있는 날을 기산일로 계산한 뒤 당초 처분의 무효와 하자를 보완한 재처분 가능성을 구분한다.","learning_material_href":"../lesson-reader/material-ntba-illegal-audit-remedy-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1765430391637_141951.pdf","related_topics":[{"primary_law":"국세기본법","title":"위법한 세무조사와 절차상 하자의 구제","topic_id":"NTBA-ILLEGAL-AUDIT-REMEDY-001"},{"primary_law":"국세기본법","title":"세무조사 절차·사전통지·연기","topic_id":"NTBA-AUDIT-PROCEDURE-001"},{"primary_law":"국세기본법","title":"국세부과 제척기간의 구조","topic_id":"NTBA-LIMITATION-001"}],"significance":"2026두30542의 하자 보완 재처분 법리와 함께 최초 처분의 무효와 적법한 재처분을 구분하고, 감면조건 위반일과 추징세액의 부과제척기간 기산일을 동일시하지 않게 한다."},{"answer_status":"학습용 해설이며 공식 답안이 아닙니다.","applicable_law_note":"구 국세기본법(2020년 12월 22일 법률 제17650호 개정 전) 제39조, 상법 제209조 제1항·제361조·제389조 제3항·제393조 제1항, 채무자 회생 및 파산에 관한 법률 제56조·제61조·제81조·제91조부터 제93조까지를 적용한다. 회생절차는 2019년 3월 18일부터 2020년 3월 11일까지였고 본래 법인세 납세의무는 2019년 12월 31일 성립했으므로, 회생절차 폐지는 과점주주 지위를 소급시키지 않으며 폐지 후 새로 성립하는 세금은 별도로 판단한다.","audit_application":{"audit_hypothesis":"납세의무 성립일에 과점주주가 주주권을 실질적으로 행사할 수 있어 제2차 납세의무 요건을 충족한다.","counter_hypothesis":"회생절차와 관리인 권한 때문에 과점주주가 주주권을 실질적으로 행사할 지위에 있지 않았다.","evidence_to_check":["납세의무 성립일과 체납세액 명세","회생개시·폐지 결정과 관리인 선임 기록","주주명부와 의결권·주주권 행사 기록","제2차 납세의무 고지서와 송달 기록"]},"case_number":"2025두33121","court":"대법원","current_law_impact":"none","decision_date":"2025-09-25","exam_question":"회생절차 중 과점주주에게 제2차 납세의무를 지우기 위한 실질적 권리행사 지위와 판단시점을 논하시오.","holding_summary":"대법원은 회생절차 중 과점주주는 원칙적으로 주주권을 실질적으로 행사할 지위에 있지 않으므로 제2차 납세의무가 부정된다는 취지로 상고를 기각하였다.","issue_summary":"회생절차 진행 중 과점주주가 주주권을 실질적으로 행사할 지위에 있어 제2차 납세의무를 부담하는지가 문제 된 사건이다.","learning_explanation":"형식적 지분율을 확인한 뒤 곧바로 결론내리지 말고, 납세의무 성립일의 회생절차 단계·관리인 권한·주주권 행사 가능성을 대조해 실질적 지위를 판단한다.","learning_material_href":"../lesson-reader/material-ncta-insolvency-secondary-001.html","official_source_url":"https://www.scourt.go.kr/sjudge/1760488777538_093937.pdf","related_topics":[{"primary_law":"국세징수법","title":"회생·파산과 제2차 납세의무의 징수 연결","topic_id":"NCTA-INSOLVENCY-SECONDARY-001"},{"primary_law":"국세기본법","title":"제2차 납세의무의 성립요건과 범위","topic_id":"NCTA-SECONDARY-LIABILITY-001"}],"significance":"주주명부와 지분율만으로 과점주주 책임을 확정하지 않고 회생절차·관리인 권한·실제 주주권 행사 가능성을 납세의무 성립일 기준으로 확인하게 한다."}],"window":{"from":"2025-09-01","to":"2026-09-01"}}</script>

      const unsafeAuthority = url.username || url.password || url.port || url.hash || url.href !== value;
      const courtPdf = url.hostname === 'www.scourt.go.kr' && /^\/sjudge\/[0-9]+_[0-9]+\.pdf$/.test(url.pathname) && !url.search;
      const lawRecord = url.hostname === 'www.law.go.kr' && url.pathname === '/LSW/precInfoP.do' && /^\?precSeq=[0-9]+$/.test(url.search);
      const newsHost = ['www.scourt.go.kr', 'sc.scourt.go.kr', 'lawclerk.scourt.go.kr'].includes(url.hostname);
      const newsKeys = [...url.searchParams.keys()];
      const allowedNewsKeys = ['gubun', 'pageIndex', 'searchOption', 'searchWord', 'seqnum', 'type'];
      const newsQuerySafe = new Set(newsKeys).size === newsKeys.length && newsKeys.every((key) => allowedNewsKeys.includes(key));
      const newsRecord = newsHost && newsQuerySafe && url.pathname === '/supreme/news/NewsViewAction2.work' && url.searchParams.get('gubun') === '4' && /^[0-9]+$/.test(url.searchParams.get('seqnum') || '');
      if (unsafeAuthority || url.protocol !== 'https:' || !(courtPdf || lawRecord || newsRecord)) {
        throw new Error('검증되지 않은 공식 출처 URL');
      }
      return value;
    }

    function validatedMaterialHref(value) {
      if (!/^\.\.\/lesson-reader\/[A-Za-z0-9._-]+\.html$/.test(value)) {
        throw new Error('검증되지 않은 학습자료 링크');
      }
      return value;
    }

    function textElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function addOptions(select, entries) {
      entries.forEach(([value, label]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        select.append(option);
      });
    }

    function populateReveal(root, record) {
      const holding = root.querySelector('.holding-content');
      holding.append(textElement('p', '', record.holding_summary));
      holding.append(textElement('h4', '', '학습 의미'));
      holding.append(textElement('p', '', record.significance));
      root.querySelector('.law-note').textContent = record.applicable_law_note;
      root.querySelector('.audit-hypothesis').textContent = record.audit_application.audit_hypothesis;
      root.querySelector('.counter-hypothesis').textContent = record.audit_application.counter_hypothesis;
      const evidence = root.querySelector('.evidence-list');
      record.audit_application.evidence_to_check.forEach((item) => evidence.append(textElement('li', '', item)));
      root.querySelector('.exam-question').textContent = record.exam_question;
      root.querySelector('.learning-explanation').textContent = record.learning_explanation;
      root.querySelector('.answer-note').textContent = record.answer_status;
    }

    function renderRecord(record, template) {
      const fragment = template.content.cloneNode(true);
      const root = fragment.querySelector('.precedent');
      root.querySelector('.case-number').textContent = record.case_number;
      root.querySelector('.case-meta').textContent = record.court + ' · ' + record.decision_date;
      const source = root.querySelector('.source-link');
      source.setAttribute('href', validatedOfficialHref(record.official_source_url));
      root.querySelector('h3').textContent = record.issue_summary;
      root.querySelector('.issue').textContent = record.significance;
      const tags = root.querySelector('.tags');
      record.related_topics.forEach((topic) => {
        tags.append(textElement('li', 'tag', topic.primary_law + ' · ' + topic.title));
      });
      const impactClass = record.current_law_impact === 'source_update_required' ? 'tag tag--source' : 'tag tag--impact';
      const impactLabel = record.current_law_impact === 'source_update_required' ? '핵심 수업 갱신 검토' : record.current_law_impact === 'supplement' ? '보충 법리' : '변경 없음';
      tags.append(textElement('li', impactClass, impactLabel));
      populateReveal(root, record);
      const material = root.querySelector('.material-link');
      material.setAttribute('href', validatedMaterialHref(record.learning_material_href));
      return fragment;
    }

    function initialize() {
      const payload = JSON.parse(document.getElementById('precedents-data').textContent);
      const records = payload.precedents;
      const register = document.getElementById('precedent-register');
      const template = document.getElementById('precedent-card-template');
      const lawFilter = document.getElementById('law-filter');
      const topicFilter = document.getElementById('topic-filter');
      const impactFilter = document.getElementById('impact-filter');
      const resultCount = document.getElementById('result-count');
      const activeSummary = document.getElementById('active-filter-summary');
      document.getElementById('window-range').textContent = payload.window.from + ' – ' + payload.window.to;

      const lawValues = new Set();
      const topicValues = new Map();
      records.forEach((record) => record.related_topics.forEach((topic) => {
        lawValues.add(topic.primary_law);
        topicValues.set(topic.topic_id, topic.title);
      }));
      addOptions(lawFilter, [...lawValues].sort().map((value) => [value, value]));
      addOptions(topicFilter, [...topicValues.entries()].sort((a, b) => a[1].localeCompare(b[1], 'ko')));

      function render() {
        const filters = {law: lawFilter.value, topic: topicFilter.value, impact: impactFilter.value};
        const visible = records.filter((record) => precedentMatches(record, filters));
        register.replaceChildren();
        visible.forEach((record) => register.append(renderRecord(record, template)));
        if (!visible.length) {
          register.append(textElement('p', 'empty', '선택한 조건에 맞는 공식 판례가 없습니다. 필터를 조정해 주세요.'));
        }
        resultCount.textContent = '총 ' + records.length + '건 중 ' + visible.length + '건';
        const labels = [lawFilter, topicFilter, impactFilter]
          .filter((select) => select.value)
          .map((select) => select.options[select.selectedIndex].textContent);
        activeSummary.textContent = labels.length ? labels.join(' · ') : '전체 공식 판례';
      }

      [lawFilter, topicFilter, impactFilter].forEach((select) => select.addEventListener('change', render));
      render();
    }

    if (typeof document !== 'undefined') initialize();
  </script>
</body>
</html>
